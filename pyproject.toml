[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot"
version = "0.2.13"
description = "Personal local voice chatbot with long-term memory"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Jack" },
]
# Fork of huggingface/speech-to-speech (Apache-2.0). The upstream
# copyright notice lives in LICENSE and NOTICE; this field records who
# maintains *this* fork.
keywords = ["voice-agents", "speech-recognition", "text-to-speech", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "huggingface-hub>=0.34.0",
    "httpx>=0.28.0",
    "nltk==3.10.0",
    "numpy>=1.26.0,<2.4.4",
    "openai==2.28.0",
    "onnxruntime>=1.17.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "scipy>=1.10.0",
    "soxr>=1.1.0",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "transformers==5.15.1",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
    "lingua-language-detector>=2.0.2",
    "mlx==0.31.1",
    "mlx-audio==0.5.0",
    "mlx-lm==0.31.1",
    "mlx-metal==0.31.1",
    "misaki[zh]>=0.9.4",
    "espeakng-loader>=0.2.4",
    "num2words>=0.5.14",
    "spacy>=3.8.4,<4.0",
    "phonemizer-fork>=3.3.2",
]

[project.urls]
Homepage = "https://github.com/JLDynamics/chatbot-grok-stt"
Repository = "https://github.com/JLDynamics/chatbot-grok-stt"
Issues = "https://github.com/JLDynamics/chatbot-grok-stt/issues"

[project.scripts]
chatbot = "chatbot.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
]
# misaki's English G2P loads this spaCy model when Kokoro starts. It is a
# direct URL, which PyPI forbids in the wheel's dependencies, so it lives in a
# default group: `uv sync` installs it, and without it `uv sync` would remove a
# hand-installed copy and misaki would try to pip-install it at runtime, which
# a uv-managed venv has no pip for.
tts-models = [
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = true
prerelease = "allow"
default-groups = ["dev", "tts-models"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["chatbot*"]
exclude = ["tests*"]

[tool.ruff]
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = false
